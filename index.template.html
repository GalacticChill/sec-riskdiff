<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SEC Risk-Factor Diff — year-over-year 10-K changes</title>
<style>
  :root {
    --ink: #0d1b2a; --ink-2: #34465a; --muted: #6b7c8f; --faint: #9aa8b6;
    --line: #e6e9ef; --line-strong: #d5dbe3; --paper: #ffffff; --page: #f4f6f9;
    --brand: #0e8f6e; --pos: #1a936f; --neg: #d1495b; --accent2: #2f6f9f; --warn: #d98c33;
    --add-bg: #e7f4ee; --add-bd: #bfe3d2; --del-bg: #fbeaec; --del-bd: #f0cdd4;
    --shadow: 0 1px 2px rgba(13,27,42,.04), 0 8px 24px rgba(13,27,42,.06);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--sans); color: var(--ink); background: var(--page); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .app { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } }

  .controls { background: var(--paper); border-right: 1px solid var(--line); padding: 26px 22px; position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; }
  @media (max-width: 900px) { .controls { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); } }
  .brandmark { display: flex; align-items: center; gap: 9px; margin-bottom: 22px; }
  .brandmark .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--brand); box-shadow: 0 0 0 4px rgba(14,143,110,.14); }
  .brandmark b { font-size: .95rem; } .brandmark span { color: var(--faint); font-size: .78rem; }
  .ctl { margin-bottom: 16px; }
  .ctl label { display: block; font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 7px; }
  select { width: 100%; font-family: var(--sans); font-size: .9rem; color: var(--ink); background: #fbfcfd; border: 1px solid var(--line-strong); border-radius: 9px; padding: 9px 11px; outline: none; }
  select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(14,143,110,.12); }
  .seg { display: flex; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; }
  .seg button { flex: 1; border: none; background: #fbfcfd; padding: 8px 6px; font-size: .8rem; color: var(--muted); cursor: pointer; font-family: var(--sans); }
  .seg button.active { background: var(--brand); color: #fff; font-weight: 600; }
  .btn { width: 100%; border: 1px solid var(--brand); background: var(--brand); color: #fff; border-radius: 9px; padding: 10px; font-size: .85rem; cursor: pointer; font-family: var(--sans); font-weight: 600; margin-top: 4px; }
  .btn:hover { filter: brightness(1.05); }
  .hint { font-size: .74rem; color: var(--faint); margin-top: 14px; line-height: 1.45; }

  .stage { padding: 34px; overflow-x: hidden; }
  @media (max-width: 900px) { .stage { padding: 20px; } }
  .sheet { max-width: 920px; margin: 0 auto; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 40px 44px 34px; }
  @media (max-width: 640px) { .sheet { padding: 26px 20px; } }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; border-bottom: 2px solid var(--ink); padding-bottom: 16px; margin-bottom: 24px; }
  .sheet-head .title { font-family: var(--serif); font-size: 1.9rem; line-height: 1.12; letter-spacing: -.01em; margin: 0; }
  .sheet-head .period { color: var(--muted); font-size: .85rem; margin-top: 6px; }
  .sheet-head .tag { text-align: right; color: var(--faint); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
  .sheet-head .tag b { display: block; color: var(--brand); font-size: .8rem; letter-spacing: .05em; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
  @media (max-width: 780px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { padding: 15px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .kpi:nth-child(4n) { border-right: none; }
  @media (max-width: 780px) { .kpi:nth-child(2n) { border-right: none; } }
  .kpi .k { font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .kpi .v { font-size: 1.4rem; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .kpi .v.pos { color: var(--pos); } .kpi .v.neg { color: var(--neg); }

  .block { margin-bottom: 24px; }
  .block h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 0 0 12px; font-weight: 700; }
  .terms { display: flex; flex-wrap: wrap; gap: 8px; }
  .term { background: var(--add-bg); border: 1px solid var(--add-bd); color: #0b6b4f; border-radius: 999px; padding: 4px 11px; font-size: .84rem; }
  .term b { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }

  .diff { font-size: .92rem; line-height: 1.65; }
  .diff .add { background: var(--add-bg); border-left: 3px solid var(--pos); padding: 4px 10px; margin: 6px 0; border-radius: 0 6px 6px 0; display: block; }
  .diff .del { background: var(--del-bg); border-left: 3px solid var(--neg); padding: 4px 10px; margin: 6px 0; border-radius: 0 6px 6px 0; display: block; color: #8a3a46; }
  .diff .del .mk { color: var(--neg); } .diff .add .mk { color: var(--pos); }
  .diff .mk { font-weight: 700; margin-right: 6px; }
  .diff .keep { color: var(--ink-2); display: block; margin: 6px 0; }
  .diff .skip { color: var(--faint); font-size: .8rem; text-align: center; margin: 10px 0; border-top: 1px dashed var(--line-strong); padding-top: 6px; }
  .legend { display: flex; gap: 16px; margin: 2px 2px 14px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .sheet-foot { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--faint); font-size: .74rem; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  @media print { .controls { display: none; } .app { display: block; } body { background: #fff; } .stage { padding: 0; } .sheet { border: none; box-shadow: none; max-width: none; border-radius: 0; padding: 0; } }
</style>
</head>
<body>
<div class="app">
  <aside class="controls">
    <div class="brandmark"><span class="dot"></span><b>Risk-Factor Diff</b><span>· 10-K changes</span></div>
    <div class="ctl">
      <label for="co">Company</label>
      <select id="co"></select>
    </div>
    <div class="ctl">
      <label>Show</label>
      <div class="seg" id="view">
        <button data-v="changes" class="active">Changes</button>
        <button data-v="added">Added</button>
        <button data-v="removed">Removed</button>
      </div>
    </div>
    <button class="btn" id="print">Print / PDF</button>
    <div class="hint">Compares the "Item 1A. Risk Factors" section of a company's two most recent 10-K filings, sentence by sentence (LCS diff). Text parsed from SEC EDGAR and bundled — no key, no network calls. Educational; not investment advice.</div>
  </aside>
  <main class="stage"><div class="sheet" id="sheet"></div></main>
</div>

<script>
var BUNDLE = /*__DATA__*/;
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var CO = BUNDLE.companies;
  var state = { co: 0, view: "changes" };

  var STOP = {};
  ("the a an and or of to in for on with as is are be been being that this these those we our us it its their they he she his her you your i none may will can could would should has have had not no any all such other more most than then them from at by an into over under out up down off about which who whom whose what when where why how if because so but also our we").split(" ").forEach(function (w) { STOP[w] = 1; });

  function sentences(text) {
    var raw = text.split(/(?<=[.!?])\s+(?=[A-Z("'“])/);
    var out = [];
    for (var i = 0; i < raw.length; i++) { var s = raw[i].trim(); if (s.length >= 3) out.push(s); }
    return out;
  }
  // strip digits too, so page numbers / years in running headers don't cause spurious mismatches
  function norm(s) { return s.toLowerCase().replace(/[^a-z ]+/g, " ").replace(/\s+/g, " ").trim(); }

  function diff(oldS, newS) {
    var a = oldS.map(norm), b = newS.map(norm), n = a.length, m = b.length;
    var dp = []; for (var i = 0; i <= n; i++) dp.push(new Int32Array(m + 1));
    for (i = n - 1; i >= 0; i--) for (var j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    var ops = []; i = 0; j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { ops.push(["keep", newS[j]]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push(["del", oldS[i]]); i++; }
      else { ops.push(["add", newS[j]]); j++; }
    }
    while (i < n) { ops.push(["del", oldS[i++]]); }
    while (j < m) { ops.push(["add", newS[j++]]); }
    return ops;
  }

  function tokens(text, bigrams) {
    var words = norm(text).split(" "), counts = {};
    for (var i = 0; i < words.length; i++) {
      var w = words[i]; if (w.length >= 4 && !STOP[w] && !/^\d+$/.test(w)) counts[w] = (counts[w] || 0) + 1;
      if (bigrams && i + 1 < words.length) {
        var w2 = words[i + 1];
        if (w.length >= 3 && w2.length >= 3 && !STOP[w] && !STOP[w2]) { var bg = w + " " + w2; counts[bg] = (counts[bg] || 0) + 1; }
      }
    }
    return counts;
  }
  function emergingTerms(oldT, newT) {
    var out = [];
    // genuinely new / intensified: frequent now, and clearly more than before (not common in both)
    for (var t in newT) { var nc = newT[t], oc = oldT[t] || 0; if (nc >= 4 && nc >= 2 * oc + 2) out.push({ t: t, nc: nc, oc: oc, score: nc - oc }); }
    out.sort(function (x, y) { return y.score - x.score; });
    return out.slice(0, 12);
  }
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function render() {
    var c = CO[state.co];
    var latest = c.years[0], prior = c.years[1];
    var oldS = sentences(prior.text), newS = sentences(latest.text);
    var ops = diff(oldS, newS);
    var added = ops.filter(function (o) { return o[0] === "add"; }).length;
    var removed = ops.filter(function (o) { return o[0] === "del"; }).length;
    var kept = ops.filter(function (o) { return o[0] === "keep"; }).length;
    var jac = kept / (kept + added + removed) * 100;
    var wordDelta = latest.words - prior.words;
    var terms = emergingTerms(tokens(prior.text, true), tokens(latest.text, true));

    var html = "";
    html += '<div class="sheet-head"><div>';
    html += '<h1 class="title">' + c.name + ' — Risk Factor Changes</h1>';
    html += '<div class="period">10-K "Item 1A" · FY' + prior.year + ' → FY' + latest.year + ' · ' + c.sector + '</div>';
    html += '</div><div class="tag">10-K Item 1A<b>Year-over-Year Diff</b></div></div>';

    html += '<div class="kpis">'
      + '<div class="kpi"><div class="k">Similarity</div><div class="v">' + jac.toFixed(0) + '%</div></div>'
      + '<div class="kpi"><div class="k">Sentences added</div><div class="v pos">+' + added + '</div></div>'
      + '<div class="kpi"><div class="k">Sentences removed</div><div class="v neg">−' + removed + '</div></div>'
      + '<div class="kpi"><div class="k">Word change</div><div class="v ' + (wordDelta >= 0 ? "pos" : "neg") + '">' + (wordDelta >= 0 ? "+" : "−") + Math.abs(wordDelta).toLocaleString() + '</div></div>'
      + '</div>';

    if (terms.length) {
      html += '<div class="block"><h3>Emerging language — new / intensified terms</h3><div class="terms">';
      terms.forEach(function (t) { html += '<span class="term">' + esc(t.t) + ' <b>' + t.nc + '×</b></span>'; });
      html += '</div></div>';
    }

    html += '<div class="block"><h3>' + (state.view === "added" ? "Added language" : state.view === "removed" ? "Removed language" : "Changes, in filing order") + '</h3>';
    html += '<div class="legend"><span><i class="sw" style="background:var(--pos)"></i> added in FY' + latest.year + '</span><span><i class="sw" style="background:var(--neg)"></i> removed since FY' + prior.year + '</span></div>';
    html += '<div class="diff">';
    if (state.view === "added") {
      ops.forEach(function (o) { if (o[0] === "add") html += '<span class="add"><span class="mk">+</span>' + esc(o[1]) + '</span>'; });
    } else if (state.view === "removed") {
      ops.forEach(function (o) { if (o[0] === "del") html += '<span class="del"><span class="mk">−</span>' + esc(o[1]) + '</span>'; });
    } else {
      var run = 0;
      ops.forEach(function (o) {
        if (o[0] === "keep") { run++; return; }
        if (run > 0) { html += '<div class="skip">⋯ ' + run + ' unchanged sentence' + (run > 1 ? "s" : "") + ' ⋯</div>'; run = 0; }
        if (o[0] === "add") html += '<span class="add"><span class="mk">+</span>' + esc(o[1]) + '</span>';
        else html += '<span class="del"><span class="mk">−</span>' + esc(o[1]) + '</span>';
      });
      if (run > 0) html += '<div class="skip">⋯ ' + run + ' unchanged sentences ⋯</div>';
    }
    html += '</div></div>';

    html += '<div class="sheet-foot"><span>Source: SEC EDGAR 10-K filings · parsed &amp; bundled ' + BUNDLE.built + '</span><span>Educational — not investment advice</span></div>';
    $("sheet").innerHTML = html;
  }

  CO.forEach(function (c, i) { var o = document.createElement("option"); o.value = i; o.textContent = c.name + " (" + c.ticker + ")"; $("co").appendChild(o); });
  $("co").addEventListener("change", function () { state.co = +this.value; render(); });
  $("view").addEventListener("click", function (e) { if (e.target.tagName !== "BUTTON") return; state.view = e.target.getAttribute("data-v"); [].forEach.call(this.querySelectorAll("button"), function (b) { b.classList.toggle("active", b === e.target); }); render(); });
  $("print").addEventListener("click", function () { window.print(); });
  render();
})();
</script>
</body>
</html>
